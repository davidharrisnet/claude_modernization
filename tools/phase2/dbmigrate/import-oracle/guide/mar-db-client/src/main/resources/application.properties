spring.application.name=mar-db-client
# A command-line client: no web server, quiet start-up.
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false

# --- Connection. Host/port depend on the network route you chose (guide section 4):
#   C (localhost proxy)  MAR_DB_HOST=localhost     MAR_DB_PORT=1522   (defaults below)
#   A (container IP)     MAR_DB_HOST=172.17.0.x    MAR_DB_PORT=1521
#   B (app in Docker)    MAR_DB_HOST=mar-oracle    MAR_DB_PORT=1521
# The password is never written here: it must come from the MAR_DB_PASSWORD environment variable.
spring.datasource.url=jdbc:oracle:thin:@//${MAR_DB_HOST:localhost}:${MAR_DB_PORT:1522}/${MAR_DB_SERVICE:FREEPDB1}
spring.datasource.username=${MAR_DB_USER:mar_app}
spring.datasource.password=${MAR_DB_PASSWORD}

# --- Connection pool (HikariCP). The tables belong to the schema MASTERANTIQUE, not to the login: every new
# connection switches to it, so JPA and plain SQL both use the unqualified table names.
spring.datasource.hikari.pool-name=mar-pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-init-sql=ALTER SESSION SET CURRENT_SCHEMA = MASTERANTIQUE

# --- JPA / Hibernate. The schema already exists (it was migrated): check it, never create or change it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# The Oracle driver fetches 10 rows per round trip by default; Hibernate warns about it.
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.sql.init.mode=never
# Uncomment to see the SQL Hibernate sends:
#logging.level.org.hibernate.SQL=debug

logging.level.root=warn
logging.level.com.masterantique=info
