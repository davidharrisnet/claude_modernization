spring.application.name=mar-db-client
# A command-line client: no web server, quiet start-up.
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false

# --- Connection. Host/port depend on the network route you chose (guide section 4):
#   C (localhost proxy)  MAR_DB_HOST=localhost     MAR_DB_PORT=5433   (defaults below)
#   A (container IP)     MAR_DB_HOST=172.17.0.x    MAR_DB_PORT=5432
#   B (app in Docker)    MAR_DB_HOST=mar-postgres  MAR_DB_PORT=5432
# The password is never written here: it must come from the MAR_DB_PASSWORD environment variable.
spring.datasource.url=jdbc:postgresql://${MAR_DB_HOST:localhost}:${MAR_DB_PORT:5433}/${MAR_DB_NAME:masterantique}
spring.datasource.username=${MAR_DB_USER:mar_app}
spring.datasource.password=${MAR_DB_PASSWORD}

# --- Connection pool (HikariCP)
spring.datasource.hikari.pool-name=mar-pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000

# --- JPA / Hibernate. The schema already exists (it was migrated): check it, never create or change it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
# Uncomment to see the SQL Hibernate sends:
#logging.level.org.hibernate.SQL=debug

logging.level.root=warn
logging.level.com.masterantique=info
